# CI for "PayHub Merchant" (the native iOS app).
#
# Lives at `apps/merchant-ios/.github/workflows/ci.yml` in the monorepo,
# becomes `.github/workflows/ci.yml` after `scripts/mirror_plugins.sh
# merchant-ios` subtree-splits the tree into `safwatech/payhub-merchant-ios`.
# GitHub Actions only picks up workflows at root-`.github/workflows/`, so this
# file is exclusively for the mirror; design accordingly (paths at root).
name: ios-ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install tools
        run: brew install xcodegen swiftlint xcbeautify

      # The monorepo's project.yml depends on the Swift SDK via `path:
      # ../../sdks/swift`. On the mirror that relative path is gone, so
      # rewrite it to the public mirror URL before xcodegen validates.
      # branch: main keeps us on whatever the SDK mirror's HEAD is until
      # `payhub-swift` 1.2.0 ships and we can pin to a tag.
      - name: Rewrite SDK package source for mirror
        run: |
          if [ ! -d ../../sdks/swift ]; then
            sed -i.bak -E "s|path: \.\./\.\./sdks/swift|url: https://github.com/safwatech/payhub-swift\n    from: \"1.2.0\"|" project.yml
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild \
            -scheme PayHubMerchant \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            clean build test | xcbeautify

      - name: SwiftLint
        run: swiftlint --strict

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: TestResults.xcresult
          if-no-files-found: ignore

  # ------------------------------------------------------------------------
  # Release: archive + upload to TestFlight. Runs on `v*` tag push or manual
  # dispatch. Required secrets (see docs/runbooks/phase-5-mobile-distribution.md):
  #
  #   APP_STORE_CONNECT_API_KEY_ID       — Key ID from App Store Connect
  #   APP_STORE_CONNECT_API_ISSUER_ID    — Issuer ID (UUID) from App Store Connect
  #   APP_STORE_CONNECT_API_KEY_P8       — base64 of the .p8 file
  #   IOS_DIST_CERT_P12_BASE64           — base64 of the distribution cert .p12
  #   IOS_DIST_CERT_PASSWORD             — password for the .p12
  #   IOS_PROVISIONING_PROFILE_BASE64    — base64 of the App Store provisioning profile
  #   IOS_TEAM_ID                        — Apple Team ID (10-char alphanumeric)
  # ------------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build-test
    runs-on: macos-14
    timeout-minutes: 60
    env:
      APP_STORE_CONNECT_API_KEY_ID:     ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID:  ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8:     ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      IOS_DIST_CERT_P12_BASE64:         ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      IOS_DIST_CERT_PASSWORD:           ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64:  ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_TEAM_ID:                      ${{ secrets.IOS_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen

      # Install signing identity into a temporary keychain so xcodebuild can
      # find it without leaking it to the default keychain.
      - name: Import distribution certificate
        run: |
          test -n "$IOS_DIST_CERT_P12_BASE64" || { echo "::error::IOS_DIST_CERT_P12_BASE64 missing"; exit 1; }
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$IOS_DIST_CERT_PASSWORD" \
                                                  -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

      - name: Install provisioning profile
        run: |
          test -n "$IOS_PROVISIONING_PROFILE_BASE64" || { echo "::error::IOS_PROVISIONING_PROFILE_BASE64 missing"; exit 1; }
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > \
              "$HOME/Library/MobileDevice/Provisioning Profiles/payhub-merchant-app-store.mobileprovision"

      - name: Generate Xcode project (with real Team ID + mirror SDK ref)
        run: |
          # project.yml's Team ID + SDK package path are both rewritten in-place
          # before xcodegen so the produced .xcodeproj is signing-ready and
          # points at the public SDK mirror.
          sed -i.bak "s/DEVELOPMENT_TEAM: \"\"/DEVELOPMENT_TEAM: \"$IOS_TEAM_ID\"/" project.yml
          if [ ! -d ../../sdks/swift ]; then
            sed -i.bak2 -E "s|path: \.\./\.\./sdks/swift|url: https://github.com/safwatech/payhub-swift\n    from: \"1.2.0\"|" project.yml
          fi
          xcodegen generate

      - name: Set MARKETING_VERSION + CURRENT_PROJECT_VERSION
        run: |
          # MARKETING_VERSION: derive from the git tag if we're on one
          # (refs/tags/v1.2.3 → 1.2.3); otherwise keep project.yml's default.
          # CURRENT_PROJECT_VERSION: GITHUB_RUN_NUMBER so every CI release
          # archive is uniquely identifiable to App Store Connect (TestFlight
          # rejects re-uploads of the same MARKETING_VERSION + CFBundleVersion
          # combo).
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            MARKETING_VERSION="${GITHUB_REF#refs/tags/v}"
            agvtool new-marketing-version "${MARKETING_VERSION}"
          fi
          agvtool new-version -all "${GITHUB_RUN_NUMBER}"

      - name: Archive
        run: |
          xcodebuild \
            -scheme PayHubMerchant \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PayHubMerchant.xcarchive \
            -allowProvisioningUpdates \
            archive

      - name: Export IPA
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>manual</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/PayHubMerchant.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export

      - name: Upload to TestFlight
        run: |
          test -n "$APP_STORE_CONNECT_API_KEY_P8" || { echo "::error::APP_STORE_CONNECT_API_KEY_P8 missing"; exit 1; }
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$APP_STORE_CONNECT_API_KEY_P8" | base64 -d > \
              "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          xcrun altool --upload-app -f build/export/PayHubMerchant.ipa \
              --type ios \
              --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
              --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Upload IPA as workflow artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: build/export/*.ipa
          if-no-files-found: ignore
