# CI for "PayHub Merchant" (the native iOS app).
#
# IMPORTANT: this workflow only runs once `apps/merchant-ios/` has been moved to
# its own repo (`safwatech/payhub-merchant-ios`) — see README. In the PayHub
# monorepo it's inert (the monorepo's own CI doesn't have a macOS runner).
#
# When it does run: regenerate the Xcode project from `project.yml`, build, run
# the unit tests in the iOS Simulator, and lint with SwiftLint.

name: ios-ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install tools
        run: brew install xcodegen swiftlint

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild \
            -scheme PayHubMerchant \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            clean build test | xcbeautify || xcodebuild \
            -scheme PayHubMerchant \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            clean build test

      - name: SwiftLint
        run: swiftlint --strict

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: TestResults.xcresult
          if-no-files-found: ignore

  # ------------------------------------------------------------------------
  # Release: archive + upload to TestFlight. Disabled until the standalone repo
  # has the signing secrets configured. Flip `if:` to `github.event_name ==
  # 'release'` (or a tag filter) and provide the secrets below.
  # ------------------------------------------------------------------------
  release:
    if: false # ← enable in the standalone repo once secrets are set
    needs: build-test
    runs-on: macos-14
    timeout-minutes: 40
    env:
      # Placeholders — set these as repo secrets in safwatech/payhub-merchant-ios:
      #   APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_API_ISSUER_ID,
      #   APP_STORE_CONNECT_API_KEY_P8 (base64 of the .p8), MATCH_PASSWORD, etc.
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Archive
        run: |
          xcodebuild \
            -scheme PayHubMerchant \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/PayHubMerchant.xcarchive \
            archive
      # - name: Export & upload to TestFlight
      #   run: |
      #     # Either `xcodebuild -exportArchive -exportOptionsPlist ExportOptions.plist`
      #     # then `xcrun altool --upload-app`, or use fastlane `pilot upload`.
      #     fastlane pilot upload --skip_waiting_for_build_processing
