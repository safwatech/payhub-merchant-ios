# SwiftLint config for PayHub Merchant.
# Conservative — this is a fresh, hand-written scaffold; rules can tighten over time.

included:
  - Sources
  - Tests

excluded:
  - .build
  - DerivedData
  - "**/*.generated.swift"

disabled_rules:
  - todo                       # we intentionally keep TODO(payhub) markers for SDK 1.2 gaps
  - trailing_comma
  - opening_brace              # SwiftUI builder style trips this a lot

opt_in_rules:
  - empty_count
  - closure_spacing
  - explicit_init
  - first_where
  - sorted_imports
  - redundant_nil_coalescing
  - vertical_whitespace_closing_braces

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 500
  error: 800
  ignore_comment_only_lines: true

function_body_length:
  warning: 80
  error: 140

cyclomatic_complexity:
  warning: 15
  error: 25

identifier_name:
  min_length: 2
  excluded:
    - id
    - vm
    - me
    - q
    - to
    - on

nesting:
  type_level: 2

reporter: "github-actions-logging"
